<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Espacial: Josy & Pedro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #050505; color: #00ff41; font-family: 'Press Start 2P', cursive; 
            text-align: center; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; overflow-x: hidden;
        }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }

        .popup { border: 4px solid #ff00ff; padding: 30px; background: #111; box-shadow: 0 0 20px #ff00ff; max-width: 400px; }

        .start-btn {
            margin-top: 20px; padding: 15px; background: #00ff41; color: #000;
            border: none; font-family: 'Press Start 2P'; cursor: pointer; box-shadow: 4px 4px 0px #008f25;
        }

        h1 { font-size: 20px; color: #ff00ff; text-shadow: 3px 3px #4b0082; margin: 20px 0; }
        p { font-size: 12px; line-height: 1.4; color: #00ffff; margin-bottom: 15px; }

        .grid { 
            display: grid; grid-template-columns: repeat(5, 68px); gap: 8px; 
            background: #111; padding: 12px; border: 4px solid #4a90e2; box-shadow: 0 0 15px #4a90e2; margin-bottom: 15px;
        }

        .cell { 
            width: 68px; height: 68px; background: #000; border: 2px solid #333; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            font-size: 24px; transition: 0.2s; color: #ffd700; -webkit-tap-highlight-color: transparent;
        }

        .cell.hit { background: #220022; border-color: #ff4d6d; animation: blink 0.5s infinite; }
        .cell.miss { background: #111; border-color: #ff0000; color: #ff0000; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #message { 
            margin-top: 15px; display: none; padding: 20px; border: 4px double #ff4d6d; 
            background: rgba(255, 77, 109, 0.1); width: 90%; max-width: 400px; animation: fadeIn 1s;
        }

        .btn {
            margin-top: 15px; padding: 15px 20px; font-family: 'Press Start 2P', cursive;
            font-size: 12px; color: white; cursor: pointer; width: 100%; display: block; box-sizing: border-box; text-decoration: none;
        }

        .btn-restart { background-color: #ff00ff; border: 4px solid #4b0082; box-shadow: 4px 4px 0px #4b0082; }
        .btn-menu { background-color: #4a90e2; border: 4px solid #003366; box-shadow: 4px 4px 0px #003366; margin-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 380px) {
            .grid { grid-template-columns: repeat(5, 58px); gap: 5px; padding: 8px;}
            .cell { width: 58px; height: 58px; font-size: 20px; }
            h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="popup">
            <p style="line-height: 1.6; font-size: 12px;">PREPARANDO MOTORES PARA A BUSCA ESTELAR...</p>
            <button class="start-btn" onclick="iniciarMissao()">INICIAR MISSÃO</button>
        </div>
    </div>

    <audio id="bgTrack" loop><source src="assets/sounds/track.wav" type="audio/wav"></audio>
    <audio id="soundClick"><source src="assets/sounds/click.wav" type="audio/wav"></audio>
    <audio id="soundWin"><source src="assets/sounds/win.wav" type="audio/wav"></audio>

    <h1>> PLAYER 1: JOSY</h1>
    <p>MISSÃO: ENCONTRE OS 3 CORAÇÕES</p>
    
    <div class="grid" id="grid"></div>
    
    <div id="message">
        <h2 style="color: #ff4d6d; font-size: 18px;">LEVEL CLEAR! 🏆</h2>
        <p style="color: #fff; font-size: 14px;">Assim como você encontrou os corações...</p>
        <p style="color: #00ffff; font-size: 14px;">Sorte a minha ter te encontrado entre 8 bilhões de pessoas.</p>
        <p style="font-size: 16px;"><strong>PEDRO AMA JOSY!</strong></p>
        
        <button class="btn btn-restart" onclick="startGame()">JOGAR DE NOVO</button>
        <a href="index.html" class="btn btn-menu">VOLTAR AO MENU</a>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const messageDiv = document.getElementById('message');
        let targets = [];
        let found = 0;

        function iniciarMissao() {
            const track = document.getElementById('bgTrack');
            track.volume = 0.5; // Música em 50% de volume
            track.play();
            document.getElementById('overlay').style.display = 'none';
        }

        function playClick() {
            const s = document.getElementById('soundClick');
            s.currentTime = 0;
            s.play(); // Efeitos tocam em volume total (1.0)
        }

        function playWin() {
            document.getElementById('soundWin').play();
        }

        function startGame() {
            grid.innerHTML = '';
            messageDiv.style.display = 'none';
            found = 0;
            targets = [];

            while(targets.length < 3){
                let r = Math.floor(Math.random() * 25);
                if(!targets.includes(r)) targets.push(r);
            }

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.classList.add('initial');
                cell.innerHTML = "★"; 
                
                cell.onclick = () => {
                    playClick();
                    cell.classList.remove('initial');
                    if (targets.includes(i)) {
                        cell.innerText = '❤️';
                        cell.classList.add('hit');
                        found++;
                        if (found === 3) {
                            playWin();
                            messageDiv.style.display = 'block';
                            setTimeout(() => { messageDiv.scrollIntoView({ behavior: 'smooth' }); }, 300);
                        }
                    } else {
                        cell.innerText = 'X'; 
                        cell.classList.add('miss');
                    }
                    cell.onclick = null; 
                };
                grid.appendChild(cell);
            }
        }
        startGame();
    </script>
</body>
</html>
