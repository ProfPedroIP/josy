<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Missão Espacial: Josy & Pedro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/arcade-theme.css">

    <style>
        /* ----- Específico da Busca Estelar ----- */
        :root { --wrapper-padding-inferior: 30px; }

        .grid { margin-bottom: 10px; }
        .cell { font-size: 24px; }
        .cell.hit { animation: blinkForte 0.5s infinite; }
        @keyframes blinkForte { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .popup { max-width: 350px; }
    </style>
</head>
<body class="tela-fixa">

    <div class="stars stars--denso stars--sobe"></div>

    <div id="app-wrapper">
        <div id="overlay">
            <div class="popup">
                <p style="line-height: 1.6; font-size: 9px; color: #00ff41;">PREPARANDO MOTORES PARA A BUSCA ESTELAR...</p>
                <button id="btn-iniciar" class="start-btn">INICIAR MISSÃO</button>
            </div>
        </div>

        <button id="btn-sound" class="btn-sound btn-flutuante-esq">🔇</button>
        <button id="btn-close" class="btn-close btn-flutuante-dir">X</button>

        <div class="game-header">
            <h1>&gt; 01. BUSCA ESTELAR</h1>
            <div class="subtitle">PLAYER 1: JOSY</div>
        </div>

        <div class="score-board" id="score-display">
            CORAÇÕES: 0 / 3<br>PONTOS: 1000
        </div>

        <div class="grid" id="grid"></div>

        <div id="message" class="message-box message-box--rosa">
            <h2 class="msg-title">MISSION CLEAR! 🏆</h2>
            <p class="msg-text">Assim como você encontrou os corações...</p>
            <p class="msg-text" style="color:#00ffff;">Sorte a minha ter te encontrado entre 8 bilhões de pessoas.</p>
            <p id="final-score-msg" style="color:#ffd700; font-size:10px; margin:10px 0;"></p>
            <p class="msg-final"><strong>PEDRO AMA JOSY!</strong></p>
            <button class="btn btn-restart" data-acao="reiniciar">JOGAR DE NOVO</button>
            <a href="index.html" class="btn btn-menu">VOLTAR AO MENU</a>
        </div>
    </div>

    <script type="module" src="src/js/games/busca-estelar.js"></script>
</body>
</html>
