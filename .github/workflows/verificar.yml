# Roda o verificador a cada commit.
# Se algo estiver errado, aparece um ✗ vermelho ao lado do commit e você
# recebe um e-mail. Não instala nada: o GitHub já tem Node e o verificador
# não usa biblioteca nenhuma.

name: Verificar o arcade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir se todo JS tem sintaxe válida
        run: |
          erros=0
          for arquivo in $(find . -name '*.js' -not -path './functions/node_modules/*'); do
            node --check "$arquivo" || { echo "ERRO DE SINTAXE: $arquivo"; erros=1; }
          done
          exit $erros

      - name: Verificar o arcade
        run: node ferramentas/verificar.mjs
