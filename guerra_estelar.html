<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Guardião Estelar: Josy & Pedro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/arcade-theme.css">

    <style>
        /* ----- Específico do Guardião Estelar ----- */
        :root { --wrapper-altura: 97%; }

        .top-controls { padding: 0 15px; margin-bottom: 5px; }
        .btn-ctrl { height: 38px; padding: 8px; }
        .btn-close { width: 45px; }

        .score-board { padding: 10px; font-size: 10px; margin-bottom: 8px; width: 90%; }

        canvas {
            width: 95%; max-width: 360px;
            height: calc(var(--vh, 1vh) * 72);
            cursor: crosshair;
        }

        .life-counter {
            position: absolute; bottom: 35px; left: 25px;
            color: var(--rosa); font-size: 10px; z-index: 100; text-shadow: 2px 2px #000;
        }

        .popup-start { padding: 20px; }
        .mode-btn {
            padding: 15px; margin-top: 15px; border: none; font-family: var(--fonte);
            cursor: pointer; font-size: 8px; width: 100%; box-shadow: 4px 4px 0px;
            text-align: left; line-height: 1.4;
        }
        .btn-classic  { background: var(--ciano); color: #000; box-shadow: 4px 4px 0px var(--ciano-sombra); }
        .btn-infinite { background: var(--magenta); color: #fff; box-shadow: 4px 4px 0px #8b008b; }

        .polaroid {
            width: 100px; height: 100px; object-fit: cover;
            border: 5px solid #fff; border-bottom: 18px solid #fff;
            margin: 10px auto; transform: rotate(-3deg);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        .game-btn { font-size: 9px; margin-top: 10px; margin-bottom: 0; }

        /* Celular deitado: sobra pouca altura, então o canvas encolhe e o
           placar e os controles ficam mais compactos. */
        @media (max-height: 480px) {
            canvas { height: calc(var(--vh, 1vh) * 100 - 120px); }
            .top-controls { margin-bottom: 2px; }
            .btn-ctrl { height: 30px; padding: 5px; font-size: 7px; }
            .score-board { padding: 5px; font-size: 8px; margin-bottom: 4px; }
            .life-counter { bottom: 8px; font-size: 8px; }
        }
    </style>
</head>
<body class="tela-fixa">

    <div class="stars stars--desce stars--rapido"></div>

    <div id="app-wrapper">
        <div class="top-controls">
            <button id="btn-pause" class="btn-ctrl btn-pause">PAUSE</button>
            <button id="btn-close" class="btn-ctrl btn-close">X</button>
        </div>

        <div class="score-board" id="score-display">PONTOS: 0</div>
        <canvas id="gameCanvas" width="360" height="580"></canvas>
        <div id="life-display" class="life-counter">VIDAS: 1</div>

        <div id="overlay">
            <div class="popup-start">
                <h2 style="color: #ff00ff; font-size: 14px; margin-bottom: 10px;">ESCOLHA O MODO</h2>
                <button id="btn-modo-classico" class="mode-btn btn-classic">
                    MODO CLÁSSICO<br>
                    <span style="font-size: 7px;">- Chegue a 1000 pontos<br>- Ritmo: 1.1x</span>
                </button>
                <button id="btn-modo-recorde" class="mode-btn btn-infinite">
                    MODO RECORDE<br>
                    <span style="font-size: 7px;">- Recorde Máximo<br>- Vidas e Tiro Especial (5 direções)</span>
                </button>
            </div>
        </div>

        <div id="message" class="message-box message-box--rosa">
            <h2 style="color:#ff4d6d; font-size:16px;">VITÓRIA! 💖</h2>
            <img src="assets/images/guerra_estelar_photo.png" class="polaroid" alt="Pedro e Josy">
            <p style="font-size: 9px; color:#fff; line-height:1.4;">O universo está a salvo, mas a minha maior conquista já foi feita... Ganhar o seu coração!</p>
            <p style="color:#ff0000; font-size:11px; margin-top:10px;"><strong>PEDRO AMA JOSY!</strong></p>
            <button class="game-btn btn-restart" data-acao="reiniciar">JOGAR DE NOVO</button>
            <a href="index.html" class="game-btn btn-menu">VOLTAR AO MENU</a>
        </div>

        <div id="game-over" class="message-box message-box--rosa">
            <h2 id="go-title" style="color:#ff0000; font-size:16px;">FIM DE JOGO</h2>
            <p id="go-text" style="font-size: 9px; color:#fff; line-height:1.4;"></p>
            <p style="color:#ff0000; font-size:11px; margin-top:10px;"><strong>PEDRO AMA JOSY!</strong></p>
            <button class="game-btn btn-restart" data-acao="reiniciar">JOGAR DE NOVO</button>
            <a href="index.html" class="game-btn btn-menu">VOLTAR AO MENU</a>
        </div>
    </div>

    <script type="module" src="src/js/games/guerra-estelar.js"></script>
</body>
</html>
