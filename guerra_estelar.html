<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Guardião Estelar: Josy & Pedro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --vh: 1vh; }
        body { 
            background: #050505; color: #00ff41; font-family: 'Press Start 2P', cursive; 
            margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; 
            height: calc(var(--vh, 1vh) * 100); width: 100vw; overflow: hidden;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 2px; height: 2px; background: transparent;
            box-shadow: 10vw 20vh #fff, 30vw 10vh #fff, 50vw 40vh #fff, 70vw 20vh #fff, 90vw 50vh #fff, 20vw 70vh #fff, 40vw 80vh #fff, 60vw 90vh #fff, 80vw 70vh #fff, 15vw 45vh #fff, 45vw 15vh #fff, 75vw 35vh #fff, 55vw 65vh #fff, 95vw 85vh #fff;
            animation: spaceMove 50s linear infinite; z-index: -1;
        }
        @keyframes spaceMove { from { transform: translateY(-100vh); } to { transform: translateY(100vh); } }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        #app-wrapper {
            position: relative; width: 100%; max-width: 450px; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; box-sizing: border-box;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        @media (min-width: 451px) {
            #app-wrapper { height: 90%; border: 2px solid #003300; border-radius: 15px; box-shadow: 0 0 50px rgba(0, 255, 65, 0.1); background: rgba(5, 5, 5, 0.8); }
        }

        .top-controls { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; margin-bottom: 10px; z-index: 50; position: absolute; top: 30px;}
        .btn-ctrl { background: #111; border: 3px solid; padding: 10px; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer; transition: 0.3s; height: 40px; display: flex; align-items: center; justify-content: center;}
        .btn-sound { color: #ff0000; border-color: #a00000; box-shadow: 3px 3px 0px #a00000; width: 45px;}
        .btn-sound.on { color: #00ff41; border-color: #008f25; box-shadow: 3px 3px 0px #008f25; }
        .btn-pause { color: #ffd700; border-color: #b89b00; box-shadow: 3px 3px 0px #b89b00; width: 80px;}
        .btn-close { color: #ff0000; border-color: #ff0000; box-shadow: 3px 3px 0px #ff0000; width: 45px; font-size: 12px;}

        .score-board { background: #111; border: 3px solid #ffd700; padding: 10px; font-size: 10px; color: #ffd700; box-shadow: 4px 4px 0px #8b6508; margin-top: 60px; margin-bottom: 10px; text-align: center; width: 80%; z-index: 50;}

        canvas { background: rgba(0, 0, 0, 0.8); border: 4px solid #4a90e2; box-shadow: 0 0 15px #4a90e2; width: 90%; max-width: 360px; aspect-ratio: 360 / 520; z-index: 5; touch-action: none; }

        .life-counter { position: absolute; bottom: calc(60px + env(safe-area-inset-bottom)); left: 25px; color: #ff4d6d; font-size: 10px; z-index: 100; text-shadow: 2px 2px #000; display: none;}

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .popup-start { border: 4px solid #ff00ff; padding: 20px; background: #111; box-shadow: 0 0 20px #ff00ff; max-width: 400px; text-align: center; }
        .mode-btn { padding: 15px; margin-top: 15px; border: none; font-family: 'Press Start 2P'; cursor: pointer; font-size: 9px; width: 100%; box-shadow: 4px 4px 0px; text-align: left; line-height: 1.4;}
        .btn-classic { background: #00ffff; color: #000; box-shadow: 4px 4px 0px #008b8b; }
        .btn-infinite { background: #ff00ff; color: #fff; box-shadow: 4px 4px 0px #8b008b; }

        #message, #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; padding: 20px; border: 4px double #ff4d6d; background: rgba(17, 17, 17, 0.98); width: 85%; max-width: 350px; z-index: 200; text-align: center; box-shadow: 0 0 30px rgba(255, 77, 109, 0.8); }
        .btn-restart { padding: 15px; font-family: 'Press Start 2P'; font-size: 9px; color: white; cursor: pointer; width: 100%; display: block; margin-top: 15px; border: 4px solid #4b0082; background: #ff00ff; }
        .btn-menu { padding: 15px; font-family: 'Press Start 2P'; font-size: 9px; color: white; cursor: pointer; width: 100%; display: block; margin-top: 10px; border: 4px solid #003366; background: #4a90e2; text-decoration: none; }
        .polaroid { width: 120px; height: 120px; object-fit: cover; border: 6px solid #fff; border-bottom: 20px solid #fff; margin: 10px auto; transform: rotate(-3deg); }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="app-wrapper">
        <div class="top-controls">
            <button id="btn-sound" class="btn-ctrl btn-sound">🔇</button>
            <button id="btn-pause" class="btn-ctrl btn-pause" onclick="togglePause()">PAUSE</button>
            <button class="btn-ctrl btn-close" onclick="window.location.href='index.html'">X</button>
        </div>

        <div class="score-board" id="score-display">PONTOS: 0</div>
        <canvas id="gameCanvas" width="360" height="520"></canvas>
        <div id="life-display" class="life-counter">VIDAS: 3</div>

        <div id="overlay">
            <div class="popup-start">
                <h2 style="color: #ff00ff; font-size: 14px; margin-bottom: 10px;">ESCOLHA SEU MODO</h2>
                <button class="mode-btn btn-classic" onclick="iniciarJogo('classic')">
                    MODO CLÁSSICO<br>
                    <span style="font-size: 7px;">- Chegue a 1000 pontos<br>- 10% mais veloz</span>
                </button>
                <button class="mode-btn btn-infinite" onclick="iniciarJogo('infinite')">
                    MODO SEM LIMITE<br>
                    <span style="font-size: 7px;">- Recorde Máximo<br>- Vidas e Power-ups</span>
                </button>
            </div>
        </div>

        <div id="message">
            <h2 style="color:#ff4d6d; font-size:16px;">VITÓRIA! 💖</h2>
            <img src="assets/images/guerra_estelar_photo.png" class="polaroid" alt="Pedro e Josy">
            <p style="font-size: 9px; color:#fff;">Minha maior conquista é você!</p>
            <p style="color:#ff0000; font-size:12px;"><strong>PEDRO AMA JOSY!</strong></p>
            <button class="btn-restart" onclick="resetGame()">JOGAR DE NOVO</button>
            <a href="index.html" class="btn-menu">VOLTAR AO MENU</a>
        </div>

        <div id="game-over">
            <h2 id="go-title" style="color:#ff0000; font-size:16px;">FIM DE JOGO</h2>
            <p id="go-text" style="font-size: 9px; color:#fff; line-height:1.4;"></p>
            <p style="color:#ff0000; font-size:11px; margin-top:10px;"><strong>PEDRO AMA JOSY!</strong></p>
            <button class="btn-restart" onclick="resetGame()">TENTAR DE NOVO</button>
            <a href="index.html" class="btn-menu">VOLTAR AO MENU</a>
        </div>
    </div>

    <audio id="bgTrack" loop><source src="assets/sounds/guerra_estelar.mp3" type="audio/mpeg"></audio>
    <audio id="soundLaser"><source src="assets/sounds/laser.wav" type="audio/wav"></audio>
    <audio id="soundExplosion"><source src="assets/sounds/explosao.wav" type="audio/wav"></audio>
    <audio id="soundPower"><source src="assets/sounds/win.wav" type="audio/wav"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const lifeDisplay = document.getElementById('life-display');
        const track = document.getElementById('bgTrack');
        const btnSound = document.getElementById('btn-sound');
        
        let gameMode = 'classic';
        let isPaused = false;
        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let frames = 0;
        let spawnRate = 80;
        let player = { x: 160, y: 440, width: 40, height: 40 };
        let bullets = [], enemies = [], items = [];
        let specialShotTimer = 0;
        let animationId;

        const fixHeight = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', fixHeight);
        window.addEventListener('pageshow', fixHeight);
        fixHeight();

        btnSound.addEventListener('click', () => {
            if (track.paused) { track.play(); btnSound.innerHTML = "🔊"; btnSound.classList.add("on"); }
            else { track.pause(); btnSound.innerHTML = "🔇"; btnSound.classList.remove("on"); }
        });

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            document.getElementById('btn-pause').innerText = isPaused ? "RESUME" : "PAUSE";
            if (isPaused) track.pause();
            else if (btnSound.classList.contains("on")) track.play();
        }

        function iniciarJogo(mode) {
            gameMode = mode;
            document.getElementById('overlay').style.display = 'none';
            lifeDisplay.style.display = (mode === 'infinite') ? 'block' : 'none';
            track.play(); btnSound.innerHTML = "🔊"; btnSound.classList.add("on");
            resetGame();
        }

        function spawnItem() {
            if (gameMode !== 'infinite') return;
            let type = Math.random() > 0.5 ? '⭐' : '⚡'; // Estrela (Vida) ou Raio (Tiro Especial)
            items.push({ x: Math.random() * (canvas.width - 30), y: -30, type, speed: 2 });
        }

        function loop() {
            if (!isPlaying || isPaused) {
                if (isPlaying) animationId = requestAnimationFrame(loop);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frames++;

            // NAVE
            ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.save(); ctx.translate(player.x + 20, player.y + 20); ctx.rotate(-45 * Math.PI / 180);
            ctx.fillText("🚀", 0, 0); ctx.restore();

            // TIROS
            if (frames % (gameMode === 'classic' ? 12 : 15) === 0) {
                bullets.push({ x: player.x + 18, y: player.y, vx: 0, vy: -10 });
                if (specialShotTimer > 0) {
                    bullets.push({ x: player.x + 18, y: player.y, vx: -5, vy: -7 });
                    bullets.push({ x: player.x + 18, y: player.y, vx: 5, vy: -7 });
                }
                document.getElementById('soundLaser').currentTime = 0;
                document.getElementById('soundLaser').play();
            }
            if (specialShotTimer > 0) specialShotTimer--;

            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = "#00ffff"; ctx.fillRect(b.x, b.y, 4, 12);
                if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
            });

            // ITENS
            if (frames % 600 === 0) spawnItem();
            items.forEach((item, i) => {
                item.y += item.speed;
                ctx.fillText(item.type, item.x + 15, item.y + 15);
                if (item.x < player.x + 40 && item.x + 30 > player.x && item.y < player.y + 40 && item.y + 30 > player.y) {
                    document.getElementById('soundPower').play();
                    if (item.type === '⭐') lives++;
                    else specialShotTimer = 300;
                    lifeDisplay.innerText = `VIDAS: ${lives}`;
                    items.splice(i, 1);
                }
                if (item.y > canvas.height) items.splice(i, 1);
            });

            // INIMIGOS
            if (frames % Math.floor(spawnRate) === 0) {
                let x = Math.random() * (canvas.width - 40);
                enemies.push({ x, y: -40, hp: 1, type: '🛸', points: 10, speed: 2 });
            }

            enemies.forEach((e, ei) => {
                e.y += e.speed;
                ctx.fillText(e.type, e.x + 20, e.y + 20);

                if (e.y > canvas.height) {
                    if (gameMode === 'infinite') {
                        lives--; lifeDisplay.innerText = `VIDAS: ${lives}`;
                        if (lives <= 0) endGame(false);
                    } else { endGame(false); }
                    enemies.splice(ei, 1);
                }

                if (e.x < player.x + 40 && e.x + 40 > player.x && e.y < player.y + 40 && e.y + 40 > player.y) endGame(false);

                bullets.forEach((b, bi) => {
                    if (b.x < e.x + 40 && b.x + 4 > e.x && b.y < e.y + 40 && b.y + 12 > e.y) {
                        bullets.splice(bi, 1); e.hp--;
                        if (e.hp <= 0) {
                            document.getElementById('soundExplosion').currentTime = 0;
                            document.getElementById('soundExplosion').play();
                            score += e.points; scoreDisplay.innerText = `PONTOS: ${score}`;
                            enemies.splice(ei, 1);
                            let growth = gameMode === 'classic' ? 1.1 : 0.8;
                            if (spawnRate > 20) spawnRate -= growth;
                            if (gameMode === 'classic' && score >= 1000) endGame(true);
                        }
                    }
                });
            });

            animationId = requestAnimationFrame(loop);
        }

        function endGame(win) {
            isPlaying = false; track.pause();
            if (win) {
                document.getElementById('message').style.display = 'block';
                if (window.registrarVitoria) window.registrarVitoria('guardiao_amor');
            } else {
                document.getElementById('game-over').style.display = 'block';
                document.getElementById('go-title').innerText = (gameMode === 'infinite') ? "MISSÃO CONCLUÍDA!" : "SISTEMA FALHOU!";
                document.getElementById('go-text').innerText = (gameMode === 'infinite') ? 
                    `Que bom que você chegou até aqui!\nPontuação final: ${score}` : 
                    "A barreira foi rompida. Tente novamente!";
                if (gameMode === 'infinite' && window.registrarRecorde) window.registrarRecorde(score, 'guerra_estelar_max');
            }
        }

        function resetGame() {
            score = 0; lives = 3; frames = 0; spawnRate = 80;
            bullets = []; enemies = []; items = []; specialShotTimer = 0;
            scoreDisplay.innerText = "PONTOS: 0";
            lifeDisplay.innerText = "VIDAS: 3";
            document.getElementById('message').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            isPlaying = true; isPaused = false;
            document.getElementById('btn-pause').innerText = "PAUSE";
            loop();
        }

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            player.x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width) - 20;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
        }, {passive: false});
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1drW6iVlzZUKaP_BcEVdACEr_cHn23vI",
            authDomain: "josyarcade.firebaseapp.com",
            databaseURL: "https://josyarcade-default-rtdb.firebaseio.com",
            projectId: "josyarcade",
            storageBucket: "josyarcade.firebasestorage.app",
            messagingSenderId: "960445216740",
            appId: "1:960445216740:web:d913dc274acdb1ffad39f1"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let userUID = null;
        onAuthStateChanged(auth, (user) => { if (user) userUID = user.uid; });

        window.registrarVitoria = async (jogo) => {
            if (!userUID) return;
            const r = ref(db, `usuarios/${userUID}/estatisticas/${jogo}`);
            const s = await get(r); set(r, (s.val() || 0) + 1);
        };
        window.registrarRecorde = async (p, jogo) => {
            if (!userUID) return;
            const r = ref(db, `usuarios/${userUID}/estatisticas/${jogo}`);
            const s = await get(r); if (p > (s.val() || 0)) set(r, p);
        };
    </script>
</body>
</html>
