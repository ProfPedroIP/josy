<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Love Bird: Josy & Pedro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/arcade-theme.css">

    <style>
        .top-controls { margin-bottom: 15px; }

        .score-board {
            border: 3px solid var(--ouro); padding: 10px 20px; font-size: 10px;
            width: 100%; margin-bottom: 15px;
        }

        .canvas-container {
            position: relative; width: 100%; max-width: 360px;
            display: flex; justify-content: center; align-items: center;
        }

        canvas {
            background: rgba(0, 0, 0, 0.8);
            width: 100%; height: auto; aspect-ratio: 360 / 600; object-fit: contain;
        }

        #countdown {
            position: absolute; font-size: 80px; color: var(--ciano); z-index: 200;
            text-shadow: 5px 5px #000; display: none; pointer-events: none;
        }

        #overlay { border-radius: 13px; flex-direction: column; }

        .popup-start { padding: 30px; }

        .btn { font-size: 10px; padding: 15px 20px; }
    </style>
</head>
<body class="tela-rolavel">

    <div class="stars stars--lateral stars--rapido"></div>

    <div id="app-wrapper">
        <div class="top-controls">
            <button id="btn-close" class="btn-close">X</button>
        </div>

        <div class="score-board" id="score-display">PONTOS: 0</div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="360" height="600"></canvas>
            <div id="countdown">3</div>
        </div>

        <div id="overlay">
            <div class="popup-start">
                <h2 style="color: #ff00ff; font-size: 16px; margin-bottom: 15px;">LOVE BIRD</h2>
                <p style="font-size: 10px; color: #fff;">Chegue em 100 pontos para a surpresa!</p>
                <button id="btn-voar" class="start-btn">VOAR 🐦</button>
            </div>
        </div>

        <div id="milestone-screen" class="message-box message-box--ciano">
            <h2 id="milestone-title" class="msg-title-cyan">MARCO ATINGIDO!</h2>
            <p id="milestone-text" class="msg-white" style="font-size:10px;"></p>
            <button class="btn btn-green" id="btn-continue">CONTINUAR</button>
        </div>

        <div id="game-over" class="message-box message-box--vermelho">
            <h2 class="msg-title-red">GAME OVER 🌑</h2>
            <p id="final-score-text" class="msg-white" style="font-size:10px;"></p>
            <button id="btn-tentar-novamente" class="btn btn-restart-lose">TENTAR NOVAMENTE</button>
            <a href="index.html" class="btn btn-menu">VOLTAR AO MENU</a>
        </div>
    </div>

    <script type="module" src="src/js/games/love-bird.js"></script>
</body>
</html>
