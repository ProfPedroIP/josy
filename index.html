<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker registrado!"));
      }
    </script>
    <title>Arcade Josy & Pedro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #050505; color: #00ff41; font-family: 'Press Start 2P', cursive; 
            text-align: center; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
            overflow: hidden; /* Evita barras de rolagem por causa das estrelas */
            position: relative;
        }

        /* EFEITO DE ESTRELAS PIXELADAS */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 2px; height: 2px;
            background: transparent;
            box-shadow: 15vw 10vh #fff, 35vw 25vh #fff, 60vw 15vh #fff, 85vw 30vh #fff, 10vw 50vh #fff, 45vw 60vh #fff, 75vw 55vh #fff, 90vw 80vh #fff, 20vw 90vh #fff, 55vw 85vh #fff, 80vw 10vh #fff, 30vw 40vh #fff, 70vw 70vh #fff, 50vw 20vh #fff, 95vw 45vh #fff;
            animation: spaceMove 100s linear infinite;
            z-index: -1;
        }

        .stars::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 1px; height: 1px;
            background: transparent;
            box-shadow: 5vw 15vh #aaa, 25vw 35vh #aaa, 50vw 5vh #aaa, 80vw 25vh #aaa, 15vw 75vh #aaa, 40vw 95vh #aaa, 70vw 45vh #aaa, 95vw 10vh #aaa;
            z-index: -1;
        }

        @keyframes spaceMove {
            from { transform: translateY(0); }
            to { transform: translateY(-100vh); }
        }

        /* Efeito CRT */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }

        .popup {
            border: 4px solid #ff00ff; padding: 30px; background: #111;
            box-shadow: 0 0 20px #ff00ff; max-width: 400px;
            position: relative; z-index: 101;
        }

        h1 { font-size: 22px; color: #ff00ff; text-shadow: 4px 4px #4b0082; margin-bottom: 40px; position: relative; z-index: 5; }

        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 300px; position: relative; z-index: 5; }

        .arcade-btn {
            padding: 20px; font-family: 'Press Start 2P'; font-size: 12px;
            background: #111; color: #00ffff; border: 4px solid #4a90e2;
            cursor: pointer; text-decoration: none; transition: 0.3s;
            box-shadow: 6px 6px 0px #4b0082;
            position: relative;
        }

        .arcade-btn:hover { background: #ff00ff; color: white; transform: scale(1.05); }

        /* Estilo Específico do Novo Jogo */
        .arcade-btn-novo {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .badge-novo {
            position: absolute;
            top: -12px;
            right: -15px;
            background: #ff00ff;
            color: #fff;
            font-size: 8px;
            padding: 6px 8px;
            border: 2px solid #fff;
            box-shadow: 2px 2px 0px #4b0082;
            animation: blink 1s infinite;
            transform: rotate(5deg);
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .footer { margin-top: 50px; font-size: 10px; color: #444; position: relative; z-index: 5; }

        .start-btn {
            margin-top: 20px; padding: 15px; background: #00ff41; color: #000;
            border: none; font-family: 'Press Start 2P'; cursor: pointer;
            box-shadow: 4px 4px 0px #008f25;
        }
    </style>
</head>
<body>

    <!-- Camada de Estrelas -->
    <div class="stars"></div>

    <!-- Popup Inicial -->
    <div id="overlay">
        <div class="popup">
            <p style="line-height: 1.6; font-size: 12px;">BEM-VINDA AO ARQUIVO DE JOGOS ARCADE DO PEDRO E DA JOSY!</p>
            <button class="start-btn" onclick="startArcade()">INICIAR</button>
        </div>
    </div>

    <!-- Áudio de Fundo -->
    <audio id="bgTrack" loop>
        <source src="assets/sounds/track.wav" type="audio/wav">
    </audio>

    <h1>🎮 JOSY ARCADE 🎮</h1>
    <p style="font-size: 12px; margin-bottom: 30px;">SELECIONE UM JOGO:</p>

    <div class="menu-container">
        <a href="batalha_estelar.html" class="arcade-btn">01. BUSCA ESTELAR</a>
        <a href="campo_minado.html" class="arcade-btn">02. MINADO AMOROUS</a>
        <a href="guerra_estelar.html" class="arcade-btn">03. GUARDIÃO DO AMOR</a>
        
        <!-- Novo Jogo Destacado -->
        <a href="love_bird.html" class="arcade-btn arcade-btn-novo">
            04. LOVE BIRD
            <span class="badge-novo">NOVO JOGO!</span>
        </a>
    </div>

    <div class="footer">MADE WITH ❤️ BY PEDRO</div>

    <script>
        function startArcade() {
            const audio = document.getElementById('bgTrack');
            audio.volume = 0.5; // Ajustando volume do menu para 50%
            audio.play().catch(e => console.log("Erro ao tocar áudio:", e));
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
