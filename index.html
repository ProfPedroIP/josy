<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Espacial: Josy & Pedro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #050505; 
            color: #00ff41; 
            font-family: 'Press Start 2P', cursive; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Efeito de Scanlines */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Aumentado em 50% (Base era 18px -> 27px) */
        h1 { font-size: 24px; color: #ff00ff; text-shadow: 4px 4px #4b0082; margin: 30px 0; }
        
        /* Aumentado em 50% (Base era 10px -> 15px) */
        p { font-size: 14px; line-height: 1.6; color: #00ffff; }

        .grid { 
            display: grid; 
            /* Células aumentadas de 60px para 90px */
            grid-template-columns: repeat(5, 85px); 
            gap: 12px; 
            background: #111;
            padding: 15px;
            border: 6px solid #4a90e2;
            box-shadow: 0 0 25px #4a90e2;
            margin-bottom: 20px;
        }

        .cell { 
            width: 85px; 
            height: 85px; 
            background: #000; 
            border: 3px solid #333; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 36px; /* Ícones maiores */
            transition: 0.2s;
            color: #444;
            -webkit-tap-highlight-color: transparent; /* Remove brilho de clique no mobile */
        }

        .cell.hit { background: #220022; border-color: #ff4d6d; animation: blink 0.5s infinite; }
        .cell.miss { background: #111; border-color: #222; color: #222; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #message { 
            margin-top: 25px; 
            display: none; 
            padding: 30px; 
            border: 6px double #ff4d6d; 
            background: rgba(255, 77, 109, 0.1);
            width: 90%; 
            max-width: 500px;
            animation: fadeIn 1s;
        }

        /* Botão Jogar de Novo - Grande e fácil de clicar */
        .btn-restart {
            margin-top: 25px;
            padding: 20px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            background-color: #ff00ff;
            color: white;
            border: 5px solid #4b0082;
            cursor: pointer;
            box-shadow: 6px 6px 0px #4b0082;
            width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Ajuste para telas muito pequenas (iPhone SE etc) */
        @media (max-width: 450px) {
            .grid { grid-template-columns: repeat(5, 65px); gap: 8px; }
            .cell { width: 65px; height: 65px; font-size: 28px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <h1>> PLAYER 1: JOSY</h1>
    <p>MISSÃO: ENCONTRE OS 3 CORAÇÕES</p>
    
    <div class="grid" id="grid"></div>
    
    <div id="message">
        <h2 style="color: #ff4d6d; font-size: 22px;">LEVEL CLEAR! 🏆</h2>
        <p style="color: #fff; font-size: 16px;">Assim como você encontrou esses corações...</p>
        <p style="color: #00ffff; font-size: 16px;">Sorte a minha ter te encontrado entre 8 bilhões de pessoas.</p>
        <p style="font-size: 18px;"><strong>PEDRO AMA JOSY!</strong></p>
        
        <button class="btn-restart" onclick="startGame()">JOGAR DE NOVO</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const messageDiv = document.getElementById('message');
        let targets = [];
        let found = 0;

        function startGame() {
            grid.innerHTML = '';
            messageDiv.style.display = 'none';
            found = 0;
            targets = [];

            while(targets.length < 3){
                let r = Math.floor(Math.random() * 25);
                if(!targets.includes(r)) targets.push(r);
            }

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerHTML = "?";
                
                cell.onclick = () => {
                    if (targets.includes(i)) {
                        cell.innerText = '❤️';
                        cell.classList.add('hit');
                        found++;
                        if (found === 3) {
                            messageDiv.style.display = 'block';
                            // Scroll suave para a mensagem no celular
                            setTimeout(() => {
                                messageDiv.scrollIntoView({ behavior: 'smooth' });
                            }, 300);
                        }
                    } else {
                        cell.innerText = 'X';
                        cell.classList.add('miss');
                    }
                    cell.onclick = null;
                };
                grid.appendChild(cell);
            }
        }

        startGame();
    </script>
</body>
</html>
