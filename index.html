<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Conexão Estelar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --vh: 1vh; }

        body { 
            background: #050505; color: #00ff41; font-family: 'Press Start 2P', cursive; 
            margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; 
            height: calc(var(--vh, 1vh) * 100); width: 100vw; overflow: hidden; position: relative;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 2px; height: 2px; background: transparent;
            box-shadow: 15vw 10vh #fff, 35vw 25vh #fff, 60vw 15vh #fff, 85vw 30vh #fff, 10vw 50vh #fff, 45vw 60vh #fff, 75vw 55vh #fff, 90vw 80vh #fff, 20vw 90vh #fff, 55vw 85vh #fff, 80vw 10vh #fff, 30vw 40vh #fff, 70vw 70vh #fff, 50vw 20vh #fff, 95vw 45vh #fff;
            animation: spaceMove 100s linear infinite; z-index: -1;
        }
        @keyframes spaceMove { from { transform: translateY(0); } to { transform: translateY(-100vh); } }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(255, 0, 0, 0.06));
            z-index: 10; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        #app-wrapper {
            position: relative; width: 100%; max-width: 450px; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; z-index: 20; box-sizing: border-box;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        @media (min-width: 451px) {
            #app-wrapper { height: 90%; border: 2px solid #003300; border-radius: 15px; box-shadow: 0 0 50px rgba(0, 255, 65, 0.1); background: rgba(5, 5, 5, 0.8); }
        }

        .question-title {
            font-size: 20px; color: #00ffff; text-shadow: 3px 3px #003366;
            margin-bottom: 50px; text-align: center; line-height: 1.6;
            padding: 0 20px;
        }

        .btn-container {
            position: relative; width: 100%; height: 150px;
            display: flex; align-items: center; justify-content: center; gap: 30px;
        }

        .choice-btn {
            padding: 18px 28px; font-family: 'Press Start 2P'; font-size: 12px; text-align: center;
            background: #111; cursor: pointer; border: 4px solid; box-sizing: border-box;
        }

        #btn-sim {
            color: #00ff41; border-color: #00ff41; box-shadow: 5px 5px 0px #003300;
            z-index: 50; transition: transform 0.2s;
        }
        #btn-sim:hover { transform: scale(1.1); background: #003300; }

        #btn-nao {
            color: #ff0055; border-color: #ff0055; box-shadow: 5px 5px 0px #550000;
            position: absolute; z-index: 1000; transition: left 0.1s ease, top 0.1s ease;
        }

        /* --- MODAL GLITCH BONITO --- */
        #glitch-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98); z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box; padding: 20px;
        }

        .glitch-wrapper { text-align: center; position: relative; }

        .glitch-title {
            font-size: 24px; font-weight: bold; color: #ff00ff;
            text-shadow: 3px 3px #4b0082; position: relative;
            animation: glitch-anim 1s linear infinite alternate; margin-bottom: 25px;
        }

        .glitch-sub {
            font-size: 11px; color: #00ffff; line-height: 1.8;
            margin-bottom: 40px; text-shadow: 2px 2px #003366;
        }

        .btn-back {
            background: #111; color: #ffd700; border: 4px solid #ffd700;
            padding: 15px 25px; font-family: 'Press Start 2P'; font-size: 9px;
            cursor: pointer; box-shadow: 4px 4px 0px #8b6508; text-decoration: none;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px -2px #ff0000, -2px 2px #0000ff; transform: translate(0); }
            50% { text-shadow: -3px 2px #ff0000, 3px -2px #0000ff; transform: translate(-2px, 2px); }
            100% { text-shadow: 3px 3px #ff0000, -3px -3px #0000ff; transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="app-wrapper">
        <div class="question-title">VOCÊ ME AMA?</div>

        <div class="btn-container" id="area-botoes">
            <button id="btn-sim" class="choice-btn" onclick="mostrarPopup()">SIM</button>
            <button id="btn-nao" class="choice-btn">NÃO</button>
        </div>

        <div id="glitch-popup">
            <div class="glitch-wrapper">
                <div class="glitch-title" data-text="TAMBÉM TE AMO!">TAMBÉM TE AMO!</div>
                <div class="glitch-sub">
                    SABIA QUE O SEU CORAÇÃO<br>
                    ERA O MEU PRÊMIO MÁXIMO.<br><br>
                    <span style="color:#ff0055;">❤️ PEDRO & JOSY ❤️</span>
                </div>
                <a href="index.html" class="btn-back">VOLTAR AO FLIPERAMA</a>
            </div>
        </div>
    </div>

    <script>
        const fixHeight = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', fixHeight);
        window.addEventListener('pageshow', fixHeight);
        fixHeight();

        const btnNao = document.getElementById('btn-nao');
        const appWrapper = document.getElementById('app-wrapper');

        function desviar() {
            // Calcula os limites baseados no wrapper para garantir que o botão não fuja da caixa visível
            const padX = btnNao.offsetWidth;
            const padY = btnNao.offsetHeight;
            
            const maxX = appWrapper.clientWidth - padX;
            const maxY = appWrapper.clientHeight - padY;

            // Gera novas posições aleatórias dentro do wrapper
            const newX = Math.floor(Math.random() * maxX);
            const newY = Math.floor(Math.random() * maxY);

            // Altera para posição absoluta em relação à tela do wrapper
            btnNao.style.position = 'absolute';
            btnNao.style.left = `${newX}px`;
            btnNao.style.top = `${newY}px`;
        }

        // Fuga do Mouse (Computador)
        btnNao.addEventListener('mouseenter', desviar);
        
        // Fuga do Toque (Dispositivos Móveis)
        btnNao.addEventListener('touchstart', (e) => {
            e.preventDefault();
            desviar();
        });

        function mostrarPopup() {
            document.getElementById('glitch-popup').style.display = 'flex';
        }
    </script>
</body>
</html>
